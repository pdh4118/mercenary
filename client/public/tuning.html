<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>머서너리 수치 조정</title>
    <style>
      :root { --bg: #14161c; --panel: #1d2029; --line: #343949; --text: #e6e9f0; --muted: #9aa1b0; --gold: #e0c05d; --changed: #ffe08a; --bad: #ff9b8f; --good: #7be08f; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 15px; }
      header { position: sticky; top: 0; z-index: 5; background: #0f1015; border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      header h1 { margin: 0; font-size: 18px; color: var(--gold); margin-right: 8px; }
      header input[type="search"] { flex: 1; min-width: 180px; max-width: 360px; padding: 8px 10px; font-size: 14px; color: var(--text); background: #12141a; border: 1px solid #3a4052; border-radius: 8px; outline: none; }
      header input[type="search"]:focus { border-color: var(--gold); }
      button { white-space: nowrap; padding: 8px 14px; font-size: 14px; color: var(--text); background: #2c3140; border: 1px solid #3f4659; border-radius: 8px; cursor: pointer; }
      button:hover:not(:disabled) { background: #384056; }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: #b8863b; border-color: #d7a24d; color: #1a1306; font-weight: 700; }
      button.primary:hover:not(:disabled) { background: #cb9644; }
      button.danger { background: #5b2a2a; border-color: #8a3f3f; }
      button.small { padding: 4px 8px; font-size: 12px; }
      .status { font-size: 13px; color: var(--muted); }
      .status.ok { color: var(--good); }
      .status.err { color: var(--bad); }
      main { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
      nav { position: sticky; top: 64px; width: 220px; flex: none; max-height: calc(100vh - 80px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
      nav a { display: flex; justify-content: space-between; gap: 6px; padding: 6px 8px; border-radius: 6px; color: var(--text); text-decoration: none; font-size: 13px; }
      nav a:hover { background: #262b3a; }
      nav a .n { color: var(--changed); font-weight: 700; }
      #groups { flex: 1; min-width: 0; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
      section > h2 { margin: 0; padding: 10px 14px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: #232736; }
      section > h2 .cnt { font-size: 12px; color: var(--muted); font-weight: 400; }
      section.closed .rows { display: none; }
      .row { display: grid; grid-template-columns: minmax(180px, 1fr) 150px 120px 70px; gap: 10px; align-items: center; padding: 7px 14px; border-top: 1px solid #262a37; }
      .row.changed { background: rgba(224, 192, 93, 0.08); }
      .row .name { overflow: hidden; text-overflow: ellipsis; }
      .row .name small { display: block; color: var(--muted); font-size: 11px; }
      .row input[type="number"] { width: 100%; padding: 6px 8px; font-size: 15px; color: var(--text); background: #12141a; border: 1px solid #3a4052; border-radius: 6px; outline: none; text-align: right; }
      .row input[type="number"]:focus { border-color: var(--gold); }
      .row.changed input[type="number"] { border-color: var(--changed); color: var(--changed); }
      .row.bad input[type="number"] { border-color: var(--bad); color: var(--bad); }
      .row .def { color: var(--muted); font-size: 12px; text-align: right; }
      .row .range { color: #6a7184; font-size: 11px; }
      .empty { padding: 30px; text-align: center; color: var(--muted); }
      .note { margin: 0 0 14px; padding: 10px 14px; background: #1b2230; border: 1px solid #2c3a55; border-radius: 10px; color: #b8c6e0; font-size: 13px; line-height: 1.6; }
      @media (max-width: 860px) { nav { display: none; } .row { grid-template-columns: 1fr 120px; } .row .def, .row button { display: none; } }
    </style>
  </head>
  <body>
    <header>
      <h1>수치 조정</h1>
      <input id="q" type="search" placeholder="이름으로 찾기 (예: 창병, 체력, 보스)" />
      <button id="save" class="primary" disabled>저장하고 적용</button>
      <button id="revert" disabled>변경 취소</button>
      <button id="resetAll" class="danger">전체를 기본값으로</button>
      <span id="status" class="status"></span>
    </header>
    <main>
      <nav id="nav"></nav>
      <div id="groups">
        <p class="note">
          숫자를 바꾸고 <b>저장하고 적용</b>을 누르면 <b>게임 중인 사람들에게도 바로 적용</b>되고, 서버를 다시 켜도 유지됩니다(서버 폴더의 <code>tuning.json</code>).
          노란색 칸은 기본값과 다른 값입니다. 오른쪽 <b>기본값</b>을 누르면 그 항목만 되돌립니다. 범위를 벗어난 값은 가까운 값으로 맞춰집니다.
          이 화면은 서버를 켠 컴퓨터에서만 열립니다(밖에서 열려면 서버에 <code>MERC_ADMIN_TOKEN</code>을 정하고 주소 뒤에 <code>?token=값</code>).
        </p>
        <div id="list"></div>
      </div>
    </main>
    <script>
      const qs = new URLSearchParams(location.search);
      const token = qs.get("token") || "";
      const headers = { "Content-Type": "application/json", ...(token ? { "x-admin-token": token } : {}) };
      const $ = (id) => document.getElementById(id);
      let defs = [];
      let saved = {}; // 서버에 저장된 현재 값
      let draft = {}; // 화면에서 편집 중인 값(저장 전)
      const closed = new Set(JSON.parse(localStorage.getItem("tuning.closed") || "[]"));

      const setStatus = (text, kind = "") => {
        const el = $("status");
        el.textContent = text;
        el.className = "status " + kind;
      };
      const fmt = (v) => (Number.isInteger(v) ? String(v) : String(Math.round(v * 10000) / 10000));
      const dirtyKeys = () => defs.filter((d) => draft[d.key] !== saved[d.key]).map((d) => d.key);

      async function api(path, body) {
        const res = await fetch(path, { method: body ? "POST" : "GET", headers, body: body ? JSON.stringify(body) : undefined });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "요청에 실패했습니다 (" + res.status + ")");
        return data;
      }

      function load(data) {
        defs = data.defs;
        saved = { ...data.values };
        draft = { ...data.values };
        render();
        refreshButtons();
      }

      function refreshButtons() {
        const n = dirtyKeys().length;
        $("save").disabled = n === 0;
        $("revert").disabled = n === 0;
        $("save").textContent = n ? "저장하고 적용 (" + n + "개)" : "저장하고 적용";
        // 묶음별 변경 개수
        document.querySelectorAll("[data-count]").forEach((el) => {
          const g = el.getAttribute("data-count");
          el.textContent = defs.filter((d) => d.group === g && draft[d.key] !== d.def).length || "";
        });
      }

      function render() {
        const q = $("q").value.trim().toLowerCase();
        const groups = new Map();
        for (const d of defs) {
          if (q && !(d.label + " " + d.group + " " + d.key).toLowerCase().includes(q)) continue;
          if (!groups.has(d.group)) groups.set(d.group, []);
          groups.get(d.group).push(d);
        }
        const list = $("list");
        const nav = $("nav");
        list.replaceChildren();
        nav.replaceChildren();
        if (groups.size === 0) {
          list.innerHTML = '<div class="empty">찾는 항목이 없습니다</div>';
          return;
        }
        let i = 0;
        for (const [name, items] of groups) {
          const id = "g" + i++;
          const a = document.createElement("a");
          a.href = "#" + id;
          a.innerHTML = "<span></span><span class='n' data-count=''></span>";
          a.firstChild.textContent = name;
          a.lastChild.setAttribute("data-count", name);
          nav.append(a);
          const sec = document.createElement("section");
          sec.id = id;
          if (!q && closed.has(name)) sec.classList.add("closed");
          const h = document.createElement("h2");
          h.innerHTML = "<span></span><span class='cnt'></span>";
          h.firstChild.textContent = name;
          h.lastChild.textContent = items.length + "개";
          h.onclick = () => {
            sec.classList.toggle("closed");
            sec.classList.contains("closed") ? closed.add(name) : closed.delete(name);
            localStorage.setItem("tuning.closed", JSON.stringify([...closed]));
          };
          sec.append(h);
          const rows = document.createElement("div");
          rows.className = "rows";
          for (const d of items) rows.append(rowFor(d));
          sec.append(rows);
          list.append(sec);
        }
        refreshButtons();
      }

      function rowFor(d) {
        const row = document.createElement("div");
        row.className = "row";
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = d.label;
        const key = document.createElement("small");
        key.textContent = d.key;
        name.append(key);
        const input = document.createElement("input");
        input.type = "number";
        input.step = String(d.step);
        input.min = String(d.min);
        input.max = String(d.max);
        input.value = fmt(draft[d.key]);
        const def = document.createElement("div");
        def.className = "def";
        def.innerHTML = "기본 <b></b><div class='range'></div>";
        def.querySelector("b").textContent = fmt(d.def);
        def.querySelector(".range").textContent = fmt(d.min) + " ~ " + fmt(d.max);
        const btn = document.createElement("button");
        btn.className = "small";
        btn.textContent = "기본값";
        const mark = () => {
          const v = Number(input.value);
          const bad = input.value === "" || !Number.isFinite(v) || v < d.min || v > d.max;
          row.classList.toggle("bad", bad);
          row.classList.toggle("changed", !bad && v !== d.def);
        };
        input.oninput = () => {
          const v = Number(input.value);
          if (input.value !== "" && Number.isFinite(v)) draft[d.key] = v;
          mark();
          refreshButtons();
        };
        btn.onclick = () => {
          draft[d.key] = d.def;
          input.value = fmt(d.def);
          mark();
          refreshButtons();
        };
        mark();
        row.append(name, input, def, btn);
        return row;
      }

      $("q").oninput = render;
      $("revert").onclick = () => {
        draft = { ...saved };
        render();
        setStatus("변경을 취소했습니다");
      };
      $("save").onclick = async () => {
        const changes = {};
        for (const k of dirtyKeys()) changes[k] = draft[k];
        try {
          setStatus("저장하는 중...");
          const data = await api("/api/tuning", { values: changes });
          load(data);
          setStatus(Object.keys(changes).length + "개를 저장하고 적용했습니다", "ok");
        } catch (e) {
          setStatus(e.message, "err");
        }
      };
      $("resetAll").onclick = async () => {
        if (!confirm("모든 수치를 기본값으로 되돌릴까요? (게임 중인 사람들에게도 바로 적용됩니다)")) return;
        try {
          load(await api("/api/tuning/reset", {}));
          setStatus("모두 기본값으로 되돌렸습니다", "ok");
        } catch (e) {
          setStatus(e.message, "err");
        }
      };
      window.addEventListener("beforeunload", (e) => {
        if (dirtyKeys().length) e.preventDefault();
      });
      api("/api/tuning").then(load).catch((e) => setStatus(e.message, "err"));
    </script>
  </body>
</html>
